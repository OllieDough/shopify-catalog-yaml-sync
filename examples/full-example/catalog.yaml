#     rules:
#       - column: tag
#         relation: equals
#         condition: new-arrivals
#     rule_logic: ANY                        # ANY | ALL

# ──────────────────────────────────────────────────────────────────────────
# SYNC BEHAVIOR REFERENCE
# ──────────────────────────────────────────────────────────────────────────
#
# On FIRST PUSH (product doesn't exist in Shopify):
#   → Everything from YAML is pushed
#   → Images uploaded, inventory set, all fields created
#
# On UPDATES (product already exists):
#   → By default: updates title, price, description, tags, etc.
#   → Skips: inventory (ops team owns it), images (already uploaded)
#   → Preserves: manual admin edits to skipped fields
#
# Sync Tokens (use in manage/ignore lists):
#   Product fields:  title, description, vendor, type, tags, seo, status
#   Variant fields:  price, compare_at, cost, weight, sku
#   Operations:      images, variant_images, inventory, variants
#
# CLI Flags Override YAML Config:
#   --force-images     → Re-upload images even if product has media
#   --with-inventory   → Push inventory even on updates
#   --skip-images      → Skip image upload
#   --only-new         → Only create new products, never update
#   --force            → Push even if Shopify has conflicts
#   --dry-run          → Preview changes without making them
