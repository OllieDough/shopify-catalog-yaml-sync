# Ember & Tide catalog — single source of truth.
# Edit this file, then: npm run sync examples/ember-tide/catalog.yaml

store: ember-tide.myshopify.com   # ← change to your *.myshopify.com

defaults:
  vendor: Ember & Tide
  inventory_qty: 25

products:
  - title: The Signet Hoodie
    type: Hoodie
    price: 128
    compare_at: 148
    cost: 38
    weight_grams: 780
    colors: [Black, Ivory]
    sizes: [XS, S, M, L, XL, XXL]
    images: ./images/the-signet-hoodie/
    tags: [hoodie, fleece, signature, embroidered, oversized]
    google_category: "Apparel & Accessories > Clothing > Activewear"
    gender: unisex
    seo_title: "The Signet Hoodie — Heavyweight Fleece"
    seo_description: "Heavyweight 14oz garment-dyed cotton fleece hoodie with embroidered signet. Black or Ivory."
    description: |
      Wear-tested through cold mornings and longer nights. The Signet is our heaviest piece — a 14oz brushed cotton fleece hoodie carrying the dual sigil of ember and tide on the back, circled in old-letter script.

      ## Fabric
      14oz garment-dyed brushed cotton fleece. 80% cotton, 20% recycled polyester. Pre-washed.

      ## Fit
      Oversized drop-shoulder. Take your usual size; size down for closer.

      ## Care
      Inside out, cold wash. Hang dry. Iron inside out only.

      Soft as water. Burn like sunshine.

